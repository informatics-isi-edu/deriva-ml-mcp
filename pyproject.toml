[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "deriva-ml-mcp-plugin"
dynamic = ["version"]
description = "DerivaML domain plugin for deriva-mcp-core"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Informatics and Scientific Research Division, USC" }
]
keywords = ["mcp", "deriva", "deriva-ml", "machine-learning"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "deriva-mcp-core",
    # v3.3.0 raised from >=1.31.0 to >=1.33.0 to require lookup_lineage
    # (v1.32.0) and validate_dataset_specs / validate_execution_configuration
    # (v1.33.0). v3.3.5 raises to >=1.36.6 to require the new
    # split_dataset(row_per=, via=, ignore_unrelated_anchors=) kwargs
    # added in deriva-ml #174/#176. Raised again to >=1.36.7 to require
    # the typed NoAssociationException / AmbiguousAssociationException
    # added in deriva-ml #180/#185. Raised again to >=1.39,<2.0 to require
    # the unified upload surface from deriva-ml ADR-0009 (#224): the legacy
    # `upload_execution_outputs` / `upload_outputs` / `upload_pending` /
    # `ExecutionSnapshot.upload_outputs` methods are GONE and replaced by
    # `Execution.commit_output_assets()` + `DerivaML.commit_pending_executions()`.
    # v1.39.0 was briefly tagged v2.0.0 and re-tagged after the user decided
    # v2.0 should wait for more bake time; the upper bound <2.0 keeps us out
    # of any future v2.0 release until we re-validate.
    # Pinned to v1.39+ for ADR-0009's unified `commit_output_assets` /
    # `commit_pending_executions` surface. The MCP plugin does not expose
    # execution lifecycle (stateless rule, v0.5.0); this pin protects
    # against any future code path that depends on the v1.39 method names
    # in the underlying library. Raised to >=1.47 for the Round A/B/C
    # surface the v0.7.0 wrappers call directly: create_asset_table
    # (deriva-ml #292), find_datasets_referencing /
    # find_features_referencing (#294), find_executions_consuming /
    # multirun_status_summary (#296).
    "deriva-ml>=1.47,<2.0",
    # NOTE: this plugin deliberately does NOT pin `deriva` (deriva-py).
    # deriva-ml pins its own deriva-py via an immutable commit SHA (as of
    # deriva-ml v1.54.0; it was a `@deriva-ml` branch before), and
    # deriva-mcp-core declares `deriva` unpinned. A `deriva @ ...@deriva-ml`
    # branch pin here used to be needed to beat core's old `@master` pin --
    # but core dropped that, and once deriva-ml moved to a SHA the plugin's
    # branch pin became a SECOND, conflicting URL for the same package. Under
    # the deriva-docker container install (`uv pip install --no-sources`,
    # which ignores [tool.uv] overrides), that surfaced as
    # "Requirements contain conflicting URLs for package `deriva`" and broke
    # the build. Letting deriva-ml drive the deriva-py version removes the
    # conflict and the maintenance treadmill. Re-add a pin ONLY if a future
    # conflict requires forcing a specific deriva-py here.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "bump-my-version",
]
# Use the operating-system trust store for TLS. Useful on hosts behind a
# corporate MITM proxy whose CA isn't in certifi's bundle. Opt-in: install
# with `pip install deriva-ml-mcp-plugin[system-certs]` or `uv sync --extra system-certs`.
system-certs = [
    "pip-system-certs>=5.3",
]

[project.entry-points."deriva_mcp.plugins"]
# Entry-point name is the bare domain ("deriva-ml"), matching the
# facebase-deriva-mcp-plugin convention (entry point "facebase"). This is the
# *plugin* token the deriva-docker `DERIVA_MCP_PLUGIN_ALLOWLIST` references —
# distinct from the distribution name (deriva-ml-mcp-plugin) and the import
# package (deriva_ml_mcp_plugin).
deriva-ml = "deriva_ml_mcp_plugin.plugin:register"

[tool.hatch.metadata]
# Kept on: deriva-ml (a [project.dependencies] entry) is itself a direct
# git URL via [tool.uv.sources], and transitive direct-reference metadata
# can still surface at build time. Harmless if every dep were on PyPI;
# required the moment any direct URL is in play.
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/deriva_ml_mcp_plugin/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deriva_ml_mcp_plugin"]

[tool.uv]
# LOCAL-ONLY deriva-py reconciliation. This override does NOT ship in the
# wheel (the built METADATA no longer pins `deriva` at all -- see the note in
# [project.dependencies]). It exists solely so a local `uv sync` / `uv run`
# resolves the sibling conflict: the `deriva-mcp-core` git source still drags
# in `deriva-py@master`, while `deriva-ml` pins `deriva-py` to an immutable
# SHA. Without this override, local resolution fails with conflicting URLs for
# `deriva`. We align local dev to deriva-ml's pin (the SHA wins). Keep this in
# lockstep with deriva-ml's deriva-py SHA on each bump; drop it entirely once
# deriva-mcp-core stops sourcing deriva-py from `@master`.
#
# The container build does NOT use this (it runs `uv pip install --no-sources`,
# which is why the [project.dependencies] pin -- not this override -- was the
# thing that broke the container and had to be removed).
override-dependencies = [
    # Lockstep with deriva-ml's deriva-py pin. deriva-ml 1.54.1 (#354,
    # "pyproject packaging migration") moved its deriva-py pin to
    # c93e71e (the deriva-py deriva-ml-branch tip); advance this to
    # match on every deriva-ml bump that changes the pin, or local
    # `uv sync` fails with conflicting URLs for `deriva`.
    "deriva @ git+https://github.com/informatics-isi-edu/deriva-py@c93e71e480e2ef501ed58077e5fff3705bcdb5a1",
]

[tool.uv.sources]
deriva-mcp-core = { git = "https://github.com/informatics-isi-edu/deriva-mcp-core.git" }
# deriva-ml is pulled from github main on every `uv sync --upgrade` so
# this repo always picks up the latest release. Local edits to a
# sibling ../deriva-ml checkout are NOT picked up automatically; commit
# and push them, then `uv sync --upgrade-package deriva-ml`. If you
# need an editable sibling for a workflow where push-then-sync is too
# slow, swap this line for
#   deriva-ml = { path = "../deriva-ml", editable = true }
# locally — but do not commit that change.
deriva-ml = { git = "https://github.com/informatics-isi-edu/deriva-ml.git" }

[tool.ruff]
line-length = 100
target-version = "py312"
# Auto-generated by hatch-vcs on every sync; reformatting it is pointless and
# the file is gitignored anyway. Excluded from both format and lint.
extend-exclude = ["src/deriva_ml_mcp_plugin/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Default invocation excludes the integration suite via `-m "not integration"`.
# Run `uv run pytest -m integration` to opt back in (still gated by a live
# Deriva server -- see tests/test_integration.py).
addopts = "-vv -r w --tb=short --disable-warnings -m \"not integration\""
filterwarnings = ["always"]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring a live Deriva catalog (skip by default)",
]

[tool.coverage.run]
source = ["src/deriva_ml_mcp_plugin"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.bumpversion]
allow_dirty = false
commit = true
tag = true
current_version = "0.8.0"
