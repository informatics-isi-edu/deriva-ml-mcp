[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "deriva-ml-mcp"
dynamic = ["version"]
description = "DerivaML domain plugin for deriva-mcp-core"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Informatics and Scientific Research Division, USC" }
]
keywords = ["mcp", "deriva", "deriva-ml", "machine-learning"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "deriva-mcp-core",
    "deriva-ml",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "bump-my-version",
]

[project.entry-points."deriva_mcp.plugins"]
deriva-ml = "deriva_ml_mcp.plugin:register"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/deriva_ml_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deriva_ml_mcp"]

[tool.uv]
override-dependencies = [
    "deriva @ git+https://github.com/informatics-isi-edu/deriva-py@2.0-dev",
]

[tool.uv.sources]
deriva-mcp-core = { path = "../deriva-mcp-core", editable = true }
deriva-ml = { path = "../deriva-ml", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Auto-generated by hatch-vcs on every sync; reformatting it is pointless and
# the file is gitignored anyway. Excluded from both format and lint.
extend-exclude = ["src/deriva_ml_mcp/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Default invocation excludes the integration suite via `-m "not integration"`.
# Run `uv run pytest -m integration` to opt back in (still gated by a live
# Deriva server -- see tests/test_integration.py).
addopts = "-vv -r w --tb=short --disable-warnings -m \"not integration\""
filterwarnings = ["always"]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring a live Deriva catalog (skip by default)",
]

[tool.coverage.run]
source = ["src/deriva_ml_mcp"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.bumpversion]
allow_dirty = false
commit = true
tag = true
current_version = "3.0.0"
